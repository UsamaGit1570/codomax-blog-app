```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Blog | MyBlog</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="logo" href="index.html">MyBlog.</a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="login.html">Logout</a>
      </div>
    </nav>
  </header>

  <main class="auth-container">
    <section class="auth-card">
      <p class="eyebrow">SHARE YOUR IDEAS</p>
      <h1>Create a Blog</h1>
      <p class="auth-description">
        Write your story and share it with the world.
      </p>

      <form id="createBlogForm">
        <div class="form-group">
          <label for="blogTitle">Blog title</label>
          <input
            type="text"
            id="blogTitle"
            name="blogTitle"
            placeholder="Enter your blog title"
            required
          >
        </div>

        <div class="form-group">
          <label for="blogCategory">Category</label>
          <select id="blogCategory" name="blogCategory" required>
            <option value="">Select a category</option>
            <option value="Technology">Technology</option>
            <option value="Web Development">Web Development</option>
            <option value="Learning">Learning</option>
            <option value="Lifestyle">Lifestyle</option>
          </select>
        </div>

        <div class="form-group">
          <label for="blogContent">Blog content</label>
          <textarea
            id="blogContent"
            name="blogContent"
            rows="8"
            placeholder="Write your blog here..."
            required
          ></textarea>
        </div>

        <button class="primary-button auth-submit" type="submit">
          Publish Blog
        </button>

        <p id="blogMessage" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-description">
        Want to remove an existing blog?
      </p>

      <a class="primary-button auth-submit"
         href="dashboard.html">
        Manage Blogs / Delete Blog
      </a>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 MyBlog. All rights reserved.</p>
  </footer>
</body>
</html>
```
