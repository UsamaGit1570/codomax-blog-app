
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MyBlog</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="logo" href="index.html">MyBlog.</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
      </div>
    </nav>
  </header>

  <main class="auth-container">
    <section class="auth-card">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Login to MyBlog</h1>
      <p class="auth-description">
        Sign in to manage your blogs and share your ideas.
      </p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="primary-button auth-submit" type="submit">
          Login
        </button>

        <p id="loginMessage" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-switch">
        Don't have an account?
        <a href="register.html">Create one</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 MyBlog. All rights reserved.</p>
  </footer>
</body>
</html>
